name: GoldAndRates Daily Content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch current prices
        env:
          GOLDANDRATES_PRICE_API_URL: ${{ secrets.GOLDANDRATES_PRICE_API_URL }}
        run: python src/prices/fetch_prices.py
      - name: Generate Arabic content
        run: python src/content/generate_content.py
      - name: Commit generated data
        run: |
          git config user.name "GoldAndRates Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/content.json
          git diff --cached --quiet || git commit -m "chore: update daily gold content"
          git push
