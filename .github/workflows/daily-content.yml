name: GoldAndRates Daily Content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: goldandrates-daily-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          python -m pip install --upgrade edge-tts pillow arabic-reshaper python-bidi

      - name: Fetch current prices
        env:
          GOLDANDRATES_PRICE_API_URL: ${{ secrets.GOLDANDRATES_PRICE_API_URL }}
        run: python src/prices/fetch_prices.py

      - name: Generate Arabic content
        run: python src/content/generate_content.py

      - name: Generate daily Arabic voice
        run: python src/video/generate_voice.py

      - name: Generate vertical video
        run: python src/video/generate_video.py

      - name: Upload video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goldandrates-daily-video
          path: |
            artifacts/goldandrates_daily.mp4
            artifacts/goldandrates_voice.mp3
            artifacts/video.json
            artifacts/voice.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated data
        run: |
          git config user.name "GoldAndRates Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prices.json data/content.json

          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "chore: update daily gold content"
          fi

          git pull --rebase origin main
          git push
